# backlog-clone 本番スタック（職場VM用）
#
# 開発用(docker-compose.yml)との違い:
#   - build しない。**ghcr.io から pull したイメージ**をタグで指定して使う
#     → 職場VMに Node 環境も npm も要らない（Docker だけ）
#   - サードパーティのイメージ(postgres 等)も ghcr.io に複製して使う。
#     職場VMは **github.com と ghcr.io にしか出られない**ため、
#     Docker Hub を直接参照できない（2026-09-14 にユーザーが確認）。
#     取得元は *_IMAGE 変数で差し替える。既定は Docker Hub の名前なので、
#     自宅では .env に何も書かなくてもそのまま動く
#   - ソースをバインドマウントしない
#   - 公開するポートは Caddy の HTTP(80) と HTTPS(443) だけ。
#     DB・Redis・Meilisearch・アプリはコンテナ間ネットワークの中だけに置く
#   - 外部へ出る通信（テレメトリ・更新確認・アナリティクス）を全部切る
#
# 使い方は docs/04-deploy.md を見る。
# 注意: `docker compose down -v` は実行しない（データが消える）。

name: backlog-clone

x-app-image: &app_image
  image: ${IMAGE_PREFIX-}backlog-clone-app:${APP_IMAGE_TAG}
  # 手元に無ければ pull する（既定 missing）。
  # IMAGE_PREFIX が空＝ローカルでビルドした物を使う場合は never にしてよい。
  # `always` にすると起動のたびに問い合わせるので、オフライン寄りの環境では遅くなる
  pull_policy: ${IMAGE_PULL_POLICY:-missing}

services:

  # ---- 入口 -------------------------------------------------------
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      # IP直打ちで待ち受ける（社内DNSに登録しない方針）。
      # 例 APP_HOST=192.168.10.20
      APP_HOST: ${APP_HOST}
      # 80番から飛ばす先。ポートを変えても正しく飛ぶよう APP_URL を使う
      APP_URL: ${APP_URL}
      # internal = Caddy内蔵のローカルCA（ブラウザが警告を出す）
      # 社内CAの証明書を使うなら、下の certs をマウントして
      # CADDY_TLS="/etc/caddy/certs/tls.crt /etc/caddy/certs/tls.key"
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
    volumes:
      # 開発用(:80のみ)とは別ファイル。こちらがTLSを終端する
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # 社内CAの証明書を置く場所。使わないなら空でよい
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # ---- Next.js（ビルド済み standalone サーバ） ---------------------
  app:
    <<: *app_image
    restart: unless-stopped
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    command: ["node", "server.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      APP_URL: ${APP_URL}
      MAIL_ENABLED: ${MAIL_ENABLED}
      GITEA_URL: ${GITEA_URL}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DOMAIN: ${GITEA_DOMAIN}
      GITEA_SSH_PORT: ${GITEA_SSH_PORT}
      # 画面とAPIにSSHのクローンURLを出すか。職場は塞がれているので false
      GIT_SSH_ENABLED: ${GIT_SSH_ENABLED:-false}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET}
      FILES_DIR: ${FILES_DIR}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ}
      RATE_LIMIT_UPDATE: ${RATE_LIMIT_UPDATE}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH}
      RATE_LIMIT_ICON: ${RATE_LIMIT_ICON}
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /login は未ログインでも 200 を返す唯一の画面。
      # / だと 307（ログインへの誘導）になり異常と区別できない
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 非同期処理 -------------------------------------------------
  worker:
    <<: *app_image
    restart: unless-stopped
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    command: ["worker.sh"]
    environment:
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MAIL_ENABLED: ${MAIL_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GITEA_URL: ${GITEA_URL}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DOMAIN: ${GITEA_DOMAIN}
      FILES_DIR: ${FILES_DIR}
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- マイグレーション（手で1回だけ動かす） -----------------------
  # docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    <<: *app_image
    profiles: ["tools"]
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    command: ["migrate.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # ---- 初期データ投入（新規構築のときだけ） ------------------------
  # docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    <<: *app_image
    profiles: ["tools"]
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    command: ["seed.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_USER_ID: ${SEED_ADMIN_USER_ID}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
    depends_on:
      postgres:
        condition: service_healthy

  # ---- 検索インデックスの作り直し（移設・復元の後に1回） -----------
  # docker compose -f docker-compose.prod.yml run --rm reindex
  reindex:
    <<: *app_image
    profiles: ["tools"]
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    command: ["reindex.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- パスワードの再設定 -------------------------------------------
  # docker compose -f docker-compose.prod.yml run --rm set-password <ID> <新パスワード>
  #
  # command ではなく entrypoint にしているのは、`run` の後ろに書いた引数が
  # command を上書きしてしまうため（こうすると引数として渡る）
  set-password:
    <<: *app_image
    profiles: ["tools"]
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    entrypoint: ["set-password.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # ---- PostgreSQL ------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Redis -----------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Meilisearch -----------------------------------------------
  meilisearch:
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.11}
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # production にするとマスターキー必須になり、Webの管理UIも無効になる
      MEILI_ENV: production
      # 既定では利用統計を meilisearch.com へ送る。切る
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  meilidata:
  caddy_data:
  caddy_config:
  files:
