# backlog-clone 開発・検証用スタック
#
# 職場VMへは `docker save` / `load` でイメージを持ち込める構成にしてある。
# 永続データは postgres のボリュームと files ボリュームの2つだけ。
# バックアップ対象がこの2つで済むようにするのが設計方針(01-design.md 1.B)。
#
# 注意: `docker compose down -v` は実行しない(CLAUDE.md)。

name: backlog-clone

services:

  # ---- 入口。TLSは職場移設時にここで面倒を見る -------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # ---- Next.js (UI + API) ---------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    # ホストのUID/GIDで動かす。root のままだとマイグレーションや
    # Prismaクライアントなど生成物が root 所有になり、ホストから触れなくなる
    user: "1000:1000"
    command: pnpm dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      APP_URL: ${APP_URL}
      MAIL_ENABLED: ${MAIL_ENABLED}
      GITEA_URL: ${GITEA_URL}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DOMAIN: ${GITEA_DOMAIN}
      GITEA_SSH_PORT: ${GITEA_SSH_PORT}
      # 開発機は 2222 を公開しているので SSH のクローンURLを出してよい
      GIT_SSH_ENABLED: ${GIT_SSH_ENABLED:-true}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET}
      # Git連携の提供元(2026-09-22)。Gitea を置き換えていく過程なので当面は併存する
      GIT_PROVIDER: ${GIT_PROVIDER:-github}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      FILES_DIR: ${FILES_DIR}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB}
      # シード投入(pnpm db:seed)でのみ使う
      SEED_ADMIN_USER_ID: ${SEED_ADMIN_USER_ID}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      RATE_LIMIT_READ: ${RATE_LIMIT_READ}
      RATE_LIMIT_UPDATE: ${RATE_LIMIT_UPDATE}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH}
      RATE_LIMIT_ICON: ${RATE_LIMIT_ICON}
    volumes:
      - ./app:/work
      - app_node_modules:/work/node_modules
      # app/worker は user 1000:1000 で動くので、このボリュームも
      # 1000:1000 所有でないと添付を書き込めない(EACCES)。
      # 初回に作られるときは root 所有になるため、
      # docker/fix-volume-perms.sh で直す
      - files:/data/files
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- 非同期処理(通知・メール・検索インデックス) ----------------
  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    command: pnpm worker
    environment:
      # メール本文のリンクを絶対URLにするために要る。
      # 無いと /issues/AA-1 のような相対パスになり、メールから開けない
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILI_URL: ${MEILI_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MAIL_ENABLED: ${MAIL_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GITEA_URL: ${GITEA_URL}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_DOMAIN: ${GITEA_DOMAIN}
      GIT_PROVIDER: ${GIT_PROVIDER:-github}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      FILES_DIR: ${FILES_DIR}
    volumes:
      - ./app:/work
      - app_node_modules:/work/node_modules
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- PostgreSQL ------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 日本語の照合順序で並べ替えが破綻しないようにする
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Redis (BullMQ) --------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Meilisearch ----------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data
    ports:
      - "${MEILI_PORT}:7700"

  # ---- Gitea (Git本体。自作しない) --------------------------------
volumes:
  pgdata:
  redisdata:
  meilidata:
  caddy_data:
  caddy_config:
  app_node_modules:
  files:
